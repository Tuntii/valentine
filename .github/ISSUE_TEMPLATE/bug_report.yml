name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: details
    attributes:
      label: Version and shell
      placeholder: "Valentine 0.2.0, zsh on macOS 15 / PowerShell 7 on Windows 10 22H2"
  - type: textarea
    id: logs
    attributes:
      label: Output or screenshots
      description: Anything Valentine printed, or a screenshot of the pane.
