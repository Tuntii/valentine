# Tests and packages Valentine on every platform. Called by ci.yml (pull requests) and
# release.yml (main), which passes the version semantic-release is about to publish.
name: Build

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: dev

permissions:
  contents: read

env:
  V_VERSION: '0.5.2' # newer V removed the json module this code still uses

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: valentine-windows-x64.zip
          - os: ubuntu-22.04 # oldest glibc still supported, so the binary runs on more distros
            asset: valentine-linux-x64.tar.gz
          - os: macos-14
            asset: valentine-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: vlang/setup-v@v1.4
        with:
          version: ${{ env.V_VERSION }}

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: SQLite for V (Windows)
        if: runner.os == 'Windows'
        run: v run "$(v -e 'print(@VEXEROOT)')/vlib/db/sqlite/install_thirdparty_sqlite.vsh"

      - name: WebView binding
        run: v install pushpak_jaiswal.webview

      - name: Test
        run: |
          if [ "$RUNNER_OS" = Windows ]; then v -cc gcc test src; else v test src; fi

      - name: Build
        run: |
          mkdir dist
          flags="-prod -d valentine_version=${{ inputs.version }}"
          if [ "$RUNNER_OS" = Windows ]; then
            v -cc gcc $flags -subsystem windows -o dist/valentine.exe src
          else
            v $flags -o dist/valentine src
          fi

      - name: Bundle Microsoft's ConPTY (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/fetch-conpty.ps1 -Dest dist

      - name: Package
        run: |
          cp LICENSE README.md dist/
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "../${{ matrix.asset }}" *
          else
            tar czf "../${{ matrix.asset }}" *
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
