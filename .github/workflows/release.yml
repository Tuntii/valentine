# Every push to main is built and tested on all platforms. When the commits since the last
# tag call for it (feat: minor, fix/perf: patch, BREAKING CHANGE: major), semantic-release
# tags the version, writes the release notes and attaches the builds.
# main is the stable channel; beta publishes pre-releases (v1.2.0-beta.1) of what is not
# ready for it yet, such as the native renderer.
name: Release

on:
  push:
    branches: [main, beta]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the dry run already checks that it may push the tag
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.next.outputs.new_release_published }}
      version: ${{ steps.next.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        uses: cycjimmy/semantic-release-action@v8
        with:
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version || 'dev' }}

  release:
    needs: [version, build]
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: cycjimmy/semantic-release-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
