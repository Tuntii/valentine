# valentine.rustapi.cloud: Valentine's webhook relay (docker valentine-relay, 127.0.0.1:3097).
# More specific than the *.rustapi.cloud vhost (rustapi-apps), so it wins.
# HTTPS uses the *.rustapi.cloud wildcard certificate.

server {
    listen 80;
    listen [::]:80;
    server_name valentine.rustapi.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name valentine.rustapi.cloud;

    ssl_certificate     /etc/letsencrypt/live/rustapi.cloud-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rustapi.cloud-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 4m; # MCP answers (read_pane); the relay caps webhooks at 1 MB
    access_log /var/log/nginx/valentine.rustapi.cloud.access.log;
    error_log  /var/log/nginx/valentine.rustapi.cloud.error.log warn;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:3097;
    }
}
