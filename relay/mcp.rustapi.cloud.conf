# mcp.rustapi.cloud: Valentine's MCP server for remote clients (a claude.ai connector), through
# the relay (docker valentine-relay, 127.0.0.1:3097). Connector URL:
#   https://mcp.rustapi.cloud/mcp/<MCP_SECRET>
# Only /mcp/ is served. No access log: the secret is in the path.
# HTTPS uses the *.rustapi.cloud wildcard certificate.

server {
    listen 80;
    listen [::]:80;
    server_name mcp.rustapi.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.rustapi.cloud;

    ssl_certificate     /etc/letsencrypt/live/rustapi.cloud-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rustapi.cloud-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    access_log off;
    error_log  /var/log/nginx/mcp.rustapi.cloud.error.log warn;

    location /mcp/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 660s; # ask_agent may wait 600 s on the PC
        proxy_pass http://127.0.0.1:3097;
    }

    location / {
        return 404;
    }
}
